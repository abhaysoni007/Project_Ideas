name: Daily AI Commits

# Runs on GitHub's servers — your PC can be off.
# Cron is UTC. 04:30 UTC = 10:00 AM IST.
# GitHub may delay scheduled runs a few minutes under load.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # PAT so pushes are attributed to you.
          token: ${{ secrets.ABHAY_GITHUB_AUTOMATION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ideas and commit
        env:
          GIT_AUTHOR_EMAIL: yuvrajsoni411@gmail.com
          GIT_AUTHOR_NAME: abhaysoni007
          GIT_BRANCH: main

          # Reduced daily commit count
          MIN_COMMITS: "3"
          MAX_COMMITS: "6"

          # Reduced weekend commit count
          WEEKEND_MIN: "2"
          WEEKEND_MAX: "4"

          # Optional free AI ideas via Groq.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

          # Current Groq free-tier model
          LLM_MODEL: openai/gpt-oss-20b

        run: python daily_commit_bot.py
